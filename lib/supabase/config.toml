
[functions.delete-account]
enabled = true
verify_jwt = true
import_map = "./functions/delete-account/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/delete-account/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/delete-account/*.html" ]

[functions.document-ingest]
enabled = true
verify_jwt = true
import_map = "./functions/document-ingest/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/document-ingest/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/document-ingest/*.html" ]

[functions.dossier-open]
enabled = true
# Chi apre il link non ha un account: la pagina pubblica chiama con la sola
# apikey anonima. I controlli (codice, PIN, blocchi, aperture) li fa la 0024.
verify_jwt = false
import_map = "./functions/dossier-open/deno.json"
entrypoint = "./functions/dossier-open/index.ts"

[functions.dossier-pdf]
enabled = true
# Il PDF e' del paziente: lo snapshot si legge con il JWT dell'utente, quindi
# sotto RLS. Senza token la funzione risponde 401.
verify_jwt = true
import_map = "./functions/dossier-pdf/deno.json"
entrypoint = "./functions/dossier-pdf/index.ts"

[functions.export-data]
enabled = true
# L'export e' dei propri dati: la richiesta passa da data_export_request con il
# JWT dell'utente, quindi sotto RLS. Senza token la funzione risponde 401.
verify_jwt = true
import_map = "./functions/export-data/deno.json"
entrypoint = "./functions/export-data/index.ts"

[functions.explain]
enabled = true
verify_jwt = true
import_map = "./functions/explain/deno.json"
entrypoint = "./functions/explain/index.ts"

