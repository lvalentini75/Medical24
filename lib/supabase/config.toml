[functions.family-member-create]
enabled = true
# Il profilo gestito nasce per conto di chi lo amministra: serve il suo JWT.
# L'utente ombra e la chiamata a family_member_register passano dal
# service_role dentro la funzione, mai dal client.
verify_jwt = true
import_map = "./functions/family-member-create/deno.json"
entrypoint = "./functions/family-member-create/index.ts"

