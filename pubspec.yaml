name: medical24
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.0
dependencies:
  path_drawing: ^1.0.0
  web: ^1.0.0
  lucide_icons_flutter: ^4.0.0
  fl_chart: ^0.68.0
  cross_file: ^0.3.4+2
  path_provider: ^2.0.0
  crop_your_image: ^2.0.0
  desktop_drop: ^0.8.4
  share_plus: ^13.0.0
  pdf: ^3.0.0
  uuid: ^4.0.0
  image_picker: '>=1.1.2'
  file_picker: '>=8.1.2'
  # >=2.10 pulls pdfrx_engine >=0.8, which no longer relies on field promotion
  # (unsupported by the Dart SDK used by the iOS release build machine).
  pdfrx: ^2.10.1
  flutter_image_compress: ^2.0.0
  image: ^4.0.0
  google_sign_in: '>=6.2.1'
  sign_in_with_apple: '>=6.1.2'
  flutter_secure_storage: ^11.0.0
  local_auth: ^3.0.0
  intl: any
  flutter_riverpod: ^3.0.0
  supabase_flutter: '>=1.10.0'
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.2.0

  flutter_web_plugins:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
  assets:
    - assets/brand/
    - assets/brand/2.0x/
    - assets/brand/3.0x/
    - assets/body/
    - assets/body/2.0x/
    - assets/body/3.0x/
    - doc/body/organ_paths.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon_1024.png
  remove_alpha_ios: true